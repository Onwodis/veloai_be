# Native Redis for local development (no Docker). Mirrors the compose service:
# append-only persistence, no password. Production still uses docker-compose.yml.
#   pnpm redis        (run from be/; data lives in be/.redis-data, git-ignored)
bind 127.0.0.1
port 6379
protected-mode yes
dir ./.redis-data
appendonly yes
appendfilename "appendonly.aof"
save 3600 1 300 100 60 10000
# BullMQ requires keys never be evicted.
maxmemory-policy noeviction
loglevel notice
